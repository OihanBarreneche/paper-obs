name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # The engine needs numpy and shapely. The api and agents extras are what the
      # interface tests and the workflow tests import, and they skip without them.
      - run: pip install -e ".[dev,api,agents]"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: apps/web
      # tsc --noEmit && vite build: the shell is compiled here, and served by
      # `paper-obs serve` from the same directory.
      - run: npm run build
        working-directory: apps/web
